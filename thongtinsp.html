<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sản Phẩm - URBAN MENSWEAR</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* CSS GIAO DIỆN STREETWEAR CỰC NGẦU */
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;500;700&display=swap');

        :root {
            --primary-color: #1e272e; /* Đen nhám */
            --accent-color: #ff3f34; /* Đỏ cam Neon */
            --bg-color: #f1f2f6; /* Xám sáng */
            --text-color: #2f3640;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); }
        
        h1, h2, h3, h4, .price { font-family: 'Oswald', sans-serif; text-transform: uppercase; }

        /* HEADER & NAV */
        header { background: var(--primary-color); color: white; text-align: center; padding: 30px 20px; }
        header h1 { font-size: 2.5rem; letter-spacing: 2px; }
        header h1 span { color: var(--accent-color); }

        nav { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        .nav-links a { text-decoration: none; color: var(--primary-color); font-weight: bold; margin-right: 20px; font-family: 'Oswald'; font-size: 1.1rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent-color); }

        /* BỐ CỤC CHI TIẾT SẢN PHẨM */
        .product-detail-wrapper { max-width: 1200px; margin: 40px auto; display: flex; gap: 40px; padding: 0 20px; flex-wrap: wrap; }
        .product-image-col { flex: 1; min-width: 300px; }
        .product-image-col img { width: 100%; border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border: 2px solid #fff; }
        
        .product-info-col { flex: 1; min-width: 300px; background: white; padding: 30px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .badge-category { display: inline-block; background: var(--primary-color); color: white; padding: 5px 12px; font-size: 12px; font-weight: bold; letter-spacing: 1px; margin-bottom: 15px; font-family: 'Oswald'; border-radius: 2px; }
        .product-info-col h2 { font-size: 2.2rem; color: var(--primary-color); margin-bottom: 10px; line-height: 1.2; }
        .product-info-col .price { font-size: 2rem; color: var(--accent-color); margin-bottom: 20px; border-bottom: 1px solid #dcdde1; padding-bottom: 20px; }
        .product-info-col .desc { font-size: 1.1rem; line-height: 1.6; color: #718093; margin-bottom: 25px; white-space: pre-line; }

        /* CSS CHO PHÂN LOẠI SIZE/MÀU */
        .variant-section { margin-bottom: 25px; }
        .variant-section strong { display: block; margin-bottom: 10px; font-family: 'Oswald'; font-size: 1.1rem; letter-spacing: 0.5px; }
        .variant-btn { padding: 10px 20px; border: 2px solid #dcdde1; border-radius: 4px; background: white; cursor: pointer; font-weight: bold; color: #718093; transition: 0.2s; font-family: 'Roboto'; font-size: 1rem; }
        .variant-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .variant-btn.active { border-color: var(--primary-color); background: var(--primary-color); color: white; }

        /* CSS CHO CÁC NÚT HÀNH ĐỘNG */
        .action-row { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
        .qty-input { width: 80px; padding: 12px; border: 2px solid #dcdde1; border-radius: 4px; font-size: 1.2rem; text-align: center; font-weight: bold; outline: none; font-family: 'Oswald'; }
        
        .btn-buy-now-detail { flex: 1; background: var(--accent-color); color: white; border: 2px solid var(--accent-color); padding: 15px; border-radius: 4px; font-size: 1.2rem; font-family: 'Oswald'; cursor: pointer; transition: 0.3s; letter-spacing: 1px; }
        .btn-buy-now-detail:hover { background: transparent; color: var(--accent-color); }
        
        .btn-add-detail-outline { flex: 1; background: var(--primary-color); color: white; border: 2px solid var(--primary-color); padding: 15px; border-radius: 4px; font-size: 1.2rem; font-family: 'Oswald'; cursor: pointer; transition: 0.3s; letter-spacing: 1px; }
        .btn-add-detail-outline:hover { background: transparent; color: var(--primary-color); }

        @media (max-width: 768px) {
            .action-row { flex-direction: column; }
            .btn-buy-now-detail, .btn-add-detail-outline { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>URBAN <span>MENSWEAR</span></h1>
    </header>
    
    <nav>
        <div class="nav-links">
            <a href="index.html">← TRỞ VỀ TRANG CHỦ</a>
            <a href="giohang.html" id="cartLink">GIỎ HÀNG (<span id="cartCount">0</span>)</a>
        </div>
        <div class="auth-buttons" id="authSection" style="font-weight: bold; color: var(--primary-color);"></div>
    </nav>

    <div class="product-detail-wrapper" id="detailContainer">
        <h3 style="text-align: center; width: 100%; color: #718093; margin-top: 50px; font-family: 'Oswald';">ĐANG TẢI THÔNG TIN SẢN PHẨM...</h3>
    </div>

    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const CART_KEY = 'UrbanCart';
        window.selectedVariant = null; 

        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            document.getElementById('cartCount').innerText = cart.reduce((t, item) => t + item.quantity, 0);
        }
        updateCartCount();

        onAuthStateChanged(auth, (user) => {
            const authSection = document.getElementById('authSection');
            if (user) {
                authSection.innerHTML = `Hi, ${user.email}`;
            } else {
                authSection.innerHTML = `<button style="background:var(--primary-color); color:white; border:none; padding:8px 15px; font-family:'Oswald'; cursor:pointer; border-radius:4px;" onclick="window.location.href='dangnhap.html'">ĐĂNG NHẬP</button>`;
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        async function loadProductDetail() {
            const container = document.getElementById('detailContainer');
            if (!productId) {
                container.innerHTML = "<h3 style='text-align:center; width:100%; color:var(--accent-color); font-family:Oswald;'>KHÔNG TÌM THẤY SẢN PHẨM NÀY!</h3>";
                return;
            }

            try {
                const docRef = doc(db, "products", productId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const product = docSnap.data();
                    
                    let variantHtml = '';
                    let displayPrice = product.price || 0; 
                    
                    window.selectedVariant = { name: 'Mặc định', price: displayPrice };

                    // XỬ LÝ NÚT BẤM SIZE/MÀU SẮC
                    if (product.variants && product.variants.length > 0) {
                        window.selectedVariant = product.variants[0];
                        displayPrice = product.variants[0].price;

                        let buttonsHtml = product.variants.map((v, index) => {
                            return `<button class="variant-btn ${index === 0 ? 'active' : ''}" onclick="selectVariant(this, '${v.name}', ${v.price})">${v.name}</button>`;
                        }).join('');

                        variantHtml = `
                            <div class="variant-section">
                                <strong>CHỌN SIZE / MÀU SẮC:</strong>
                                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                    ${buttonsHtml}
                                </div>
                            </div>
                        `;
                    }

                    container.innerHTML = `
                        <div class="product-image-col">
                            <img src="${product.imageUrl}" alt="${product.name}">
                        </div>
                        <div class="product-info-col">
                            <span class="badge-category">${product.category || 'URBAN STYLE'}</span>
                            <h2>${product.name}</h2>
                            <p class="price" id="displayPrice">${displayPrice.toLocaleString('vi-VN')} ₫</p>
                            
                            ${variantHtml}
                            
                            <p class="desc">${product.description || 'Sản phẩm hot trend đang được săn đón cực mạnh.'}</p>
                            
                            <div class="action-row">
                                <input type="number" id="detailQty" class="qty-input" value="1" min="1">
                                
                                <button class="btn-buy-now-detail" onclick="buyNowDetail('${productId}', '${product.name}', '${product.imageUrl}')">
                                    MUA NGAY CHỐT ĐƠN
                                </button>

                                <button class="btn-add-detail-outline" onclick="addDetailToCart('${productId}', '${product.name}', '${product.imageUrl}')">
                                    THÊM VÀO GIỎ HÀNG
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML = "<h3 style='text-align:center; width:100%; color:var(--accent-color); font-family:Oswald;'>SẢN PHẨM ĐÃ BỊ XÓA HOẶC KHÔNG TỒN TẠI!</h3>";
                }
            } catch (error) {
                container.innerHTML = "<h3 style='text-align:center; width:100%; color:var(--accent-color); font-family:Oswald;'>LỖI KẾT NỐI MÁY CHỦ!</h3>";
            }
        }

        loadProductDetail();

        // XỬ LÝ CHUYỂN ĐỔI SIZE/MÀU
        window.selectVariant = function(btnElement, vName, vPrice) {
            document.querySelectorAll('.variant-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            window.selectedVariant = { name: vName, price: vPrice };
            document.getElementById('displayPrice').innerText = vPrice.toLocaleString('vi-VN') + ' ₫';
        }

        // MUA NGAY (Ghi đè giỏ hàng & Sang trang thanh toán)
        window.buyNowDetail = function(id, baseName, image) {
            const qtyInput = parseInt(document.getElementById('detailQty').value) || 1;
            const vName = window.selectedVariant.name;
            const finalPrice = window.selectedVariant.price;
            const finalName = vName !== 'Mặc định' ? baseName : baseName; // Tên hiển thị

            const item = { 
                id: id, 
                name: finalName, 
                price: finalPrice, 
                image: image, 
                quantity: qtyInput,
                variant: vName 
            };
            
            localStorage.setItem(CART_KEY, JSON.stringify([item]));
            window.location.href = 'giohang.html';
        }

        // THÊM VÀO GIỎ (Không rời trang)
        window.addDetailToCart = function(id, baseName, image) {
            const qtyInput = parseInt(document.getElementById('detailQty').value);
            if(qtyInput < 1 || isNaN(qtyInput)) return alert("Số lượng không hợp lệ bro ơi!");

            const vName = window.selectedVariant.name;
            const finalPrice = window.selectedVariant.price;
            const finalName = vName !== 'Mặc định' ? baseName : baseName;

            let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            
            // Tìm trong giỏ xem có áo nào trùng ID và TRÙNG CẢ SIZE/MÀU không
            const existingItem = cart.find(item => item.id === id && item.variant === vName);
            
            if (existingItem) {
                existingItem.quantity += qtyInput; 
            } else {
                cart.push({ 
                    id: id, 
                    name: finalName, 
                    price: finalPrice, 
                    image: image, 
                    quantity: qtyInput,
                    variant: vName 
                });
            }
            
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
            updateCartCount();
            
            // Nút "Giỏ hàng" rung nhẹ tạo hiệu ứng chú ý (Tùy chọn)
            alert(`Đã quăng áo (Loại: ${vName}) vào giỏ hàng thành công!`);
        }
    </script>
</body>
</html>
